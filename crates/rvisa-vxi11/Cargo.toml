[package]
name = "rvisa-vxi11"
description = "Pure-Rust VXI-11 backend for rvisa (TCPIP::host[::inst0]::INSTR)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["visa", "instrument", "vxi-11", "lxi", "test-measurement"]
categories = ["hardware-support", "network-programming"]

[features]
## Service request events through the VXI-11 interrupt channel (DESIGN.md R7).
srq = []
## `Vxi11Server`, which serves any session as a VXI-11 instrument, for tests.
server = []

[dependencies]
rvisa-core.workspace = true
socket2 = "0.6"
tracing.workspace = true

[dev-dependencies]
rvisa-conformance.workspace = true
rvisa-mock.workspace = true
rvisa-vendor.workspace = true
# The integration tests need the test server and SRQ.
rvisa-vxi11 = { path = ".", features = ["server", "srq"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
