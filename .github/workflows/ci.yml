name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Runs on the pinned MSRV toolchain from rust-toolchain.toml, so this is
  # also the MSRV check.
  test:
    name: test (${{ matrix.os }}, MSRV)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace
      - run: cargo doc --workspace --all-features --no-deps

  stable:
    name: test (ubuntu, stable)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  cross:
    name: cross-compile check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo check --workspace --all-features --all-targets --target ${{ matrix.target }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: resource parser coverage (>= 95% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p rvisa-core --json --summary-only --output-path coverage.json
      - name: Check resource.rs line coverage
        run: |
          pct=$(jq '.data[0].files[] | select(.filename | endswith("rvisa-core/src/resource.rs")) | .summary.lines.percent' coverage.json)
          echo "resource.rs line coverage: $pct%"
          awk -v p="$pct" 'BEGIN { exit !(p >= 95) }'

  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [resource_name, ieee488_block, search_pattern]
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Fuzz for 60 seconds
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          seeds=seeds/${{ matrix.target }}
          [ -d "$seeds" ] || seeds=
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} $seeds -- -max_total_time=60
