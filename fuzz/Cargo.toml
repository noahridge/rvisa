[package]
name = "rvisa-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rvisa-core = { path = "../crates/rvisa-core" }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]
members = ["."]

[[bin]]
name = "resource_name"
path = "fuzz_targets/resource_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ieee488_block"
path = "fuzz_targets/ieee488_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search_pattern"
path = "fuzz_targets/search_pattern.rs"
test = false
doc = false
bench = false
